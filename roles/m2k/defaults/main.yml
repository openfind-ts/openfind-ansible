---
# Mail2000 產品標準值：所有客戶都一樣的值放這裡，客戶差異放客戶 inventory 的 group_vars/m2k.yml
m2k_install_dir: /webmail
m2k_conf_dir: "{{ m2k_install_dir }}/httpd/conf"
m2k_run_user: webmail
m2k_restart_cmd: /webmail/tools/m2kctrl httpd restart

# check.yml 讀取的版本檔（客製化客戶確認可用；第一欄格式見 check.yml）
m2k_version_file: "{{ m2k_install_dir }}/etc/system_version.info"
# check.yml 是否顯示這台的 patch 安裝紀錄（m2k_patch_record_file）；各客製化客戶紀錄方式不同，由客戶 inventory 開啟
m2k_check_patch_record: false

# 換憑證（cert.yml → web_cert）
m2k_ssl_conf: "TODO"  # TODO: 確認 M2K 的 SSL 設定檔路徑
m2k_ssl_include: "TODO"  # TODO: 確認是否需要在 httpd.conf 啟用 Include；不需要請改成空字串 ""
m2k_cert_owner: "{{ m2k_run_user }}"  # TODO: 確認憑證檔擁有者
m2k_cert_src: ""  # 由客戶 group_vars/m2k.yml 指定，例如 "{{ inventory_dir }}/files/m2k.crt"
m2k_key_src: ""   # 私鑰須以 ansible-vault encrypt 加密

# patch.yml 的目標版本，由客戶 group_vars/m2k.yml 指定
m2k_version: ""

# patch.yml：control node 上放 patch 的目錄，由客戶 group_vars/m2k.yml 指定，例如 "{{ inventory_dir }}/files/patch"
m2k_patch_dir: ""
m2k_patch_file_pattern: "m2kpatchv*_Linux64.*.tgz"
m2k_patch_record_file: "{{ m2k_install_dir }}/etc/m2kpatch.info"   # installer 寫的安裝紀錄；多主機共用 etc 時應 link 到各台本機
m2k_patch_tmp_dir: /tmp   # 主機上解開 patch 的位置，裝完不清，交給系統的 tmp 清理
m2k_patch_timeout: 3600    # 所有 patch 的 installer 合計最長秒數，超過會被終止；實測兩個 patch 約 3–4 分鐘
m2k_ctrl_cmd: "{{ m2k_install_dir }}/tools/m2kctrl"   # 以 m2k_run_user 執行：-s all -c stop|start|status

# 這個產品內含的元件，CVE 掃描（playbooks/cve_check.yml）只掃有列出的元件
m2k_components: [php]
# 各元件的實際位置；有寫就只搜這些目錄，沒寫才搜整個安裝目錄
m2k_component_paths:
  php:
    - /webmail/php/bin
