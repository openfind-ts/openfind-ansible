---
# 依序安裝 m2k_patch_dir 底下比主機目前版本新的 patch，裝到最新為止；已是最新就跳過。
# 目前只適用客製化客戶：已裝的 patch 看 m2kpatch.info，patch 名稱看 patch.info 的 Name，格式都是 mp + 主次版本 + 建置時間。
- name: 確認已指定目標版本與 patch 目錄
  ansible.builtin.assert:
    that:
      - m2k_version | length > 0
      - m2k_patch_dir | length > 0
    fail_msg: "請在客戶 group_vars/m2k.yml 設定 m2k_version 與 m2k_patch_dir"
    quiet: true

# --- control node：找出所有 patch 並讀出名稱 ---
- name: 找出 patch 檔
  ansible.builtin.find:
    paths: "{{ m2k_patch_dir }}"
    patterns: "{{ m2k_patch_file_pattern }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: m2k_patch_files

- name: 讀取各 patch 的 patch.info
  ansible.builtin.command:
    argv:
      - tar
      - -xzvOf
      - "{{ item.path }}"
      - --wildcards
      - --no-wildcards-match-slash
      - "*/patch.info"
  loop: "{{ m2k_patch_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  check_mode: false
  register: m2k_patch_info

# tar -v 把成員路徑寫到 stderr，-O 把 patch.info 內容寫到 stdout
# 先清空，serial 分批重跑時才不會重複累加
- name: 清空 patch 清單
  ansible.builtin.set_fact:
    m2k_patch_available: []

- name: 整理 patch 清單
  ansible.builtin.set_fact:
    m2k_patch_available: "{{ m2k_patch_available + [m2k_patch_item] }}"
  vars:
    m2k_patch_name: "{{ item.stdout | regex_search('^Name\\s*=\\s*(mp\\d{12})\\s*$', '\\1', multiline=True) | default([''], true) | first }}"
    m2k_patch_item:
      file: "{{ item.item.path }}"
      dir: "{{ item.stderr_lines | first | dirname }}"
      name: "{{ m2k_patch_name }}"
      major: "{{ m2k_patch_name[2:4] }}"
      stamp: "{{ m2k_patch_name[4:] }}"
  loop: "{{ m2k_patch_info.results }}"
  loop_control:
    label: "{{ item.item.path | basename }}"

- name: 確認每個 patch 都讀得到名稱
  ansible.builtin.assert:
    that:
      - m2k_patch_available | length > 0
      - m2k_patch_available | selectattr('name', 'equalto', '') | list | length == 0
    fail_msg: "{{ m2k_patch_dir }} 沒有 patch，或有 patch 的 patch.info 讀不到 Name"
    quiet: true

# --- 主機：判斷目前版本與要裝的 patch ---
# 看 installer 自己寫的安裝紀錄 m2kpatch.info，不看 system_version.info：
# 多主機共用 /webmail/etc 時 system_version.info 是共用的，m2kpatch.info 可 link 到各台本機（installer 用附加寫入，link 會保留）
- name: 讀取這台的 patch 安裝紀錄
  ansible.builtin.slurp:
    src: "{{ m2k_patch_record_file }}"
  register: m2k_patch_record

# 目前版本 = 紀錄中與 m2k_version 同主次版本、時間最新的一筆（紀錄可能有重複或順序不一）
- name: 計算要安裝的 patch
  ansible.builtin.set_fact:
    m2k_patch_current: "{{ m2k_patch_recorded | max if m2k_patch_recorded | length > 0 else '' }}"
    m2k_patch_pending: >-
      {{ m2k_patch_available
         | selectattr('major', 'equalto', m2k_patch_major)
         | selectattr('stamp', 'gt', (m2k_patch_recorded | max)[4:] if m2k_patch_recorded | length > 0 else '9999999999')
         | sort(attribute='stamp') }}
  vars:
    m2k_patch_major: "{{ m2k_version | replace('.', '') }}"
    m2k_patch_recorded: >-
      {{ (m2k_patch_record.content | b64decode).splitlines()
         | map('regex_replace', '^\s*(\S*).*$', '\1')
         | select('match', '^mp' ~ m2k_patch_major ~ '\d{10}$') | list }}

- name: 確認安裝紀錄裡有這個版本的 patch
  ansible.builtin.assert:
    that:
      - m2k_patch_current | length > 0
    fail_msg: "{{ m2k_patch_record_file }} 找不到 m2k_version={{ m2k_version }} 的 patch 紀錄（mp{{ m2k_version | replace('.', '') }}...）"
    quiet: true

- name: 顯示安裝計畫
  ansible.builtin.debug:
    msg: "目前 {{ m2k_patch_current }}；{{ m2k_patch_plan }}"
  vars:
    m2k_patch_plan: >-
      {{ '將依序安裝 ' ~ (m2k_patch_pending | map(attribute='dir') | join(' → '))
         if m2k_patch_pending | length > 0 else '已是最新，不需安裝' }}

# --- 安裝：傳檔、停服務、依序執行 installer、啟動服務 ---
- name: 安裝 patch
  when: m2k_patch_pending | length > 0
  block:
    # 解開後留在暫存目錄，交給系統的 tmp 清理機制
    - name: 傳送並解開 patch
      ansible.builtin.unarchive:
        src: "{{ item.file }}"
        dest: "{{ m2k_patch_tmp_dir }}"
        creates: "{{ m2k_patch_tmp_dir }}/{{ item.dir }}/patch_installer.pl"
      loop: "{{ m2k_patch_pending }}"
      loop_control:
        label: "{{ item.dir }}"

    # installer 會檢查相關服務已停止，不會自己停
    - name: 停止 Mail2000 服務
      ansible.builtin.command:
        argv: [su, "{{ m2k_run_user }}", -c, "{{ m2k_ctrl_cmd }} -s all -c stop"]
      changed_when: true
      notify: Start m2k services

    # 用一個 shell 依序執行，任一個失敗就停，不會接著裝後面的 patch；每裝完一個確認版本已更新
    # 非同步執行：SSH 斷線或控制機中斷時 installer 仍會在主機上裝完，不會裝到一半；超過 m2k_patch_timeout 會被終止，要設寬一點
    - name: 依序執行 patch_installer.pl
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -eo pipefail
          {% for p in m2k_patch_pending %}
          echo "===== {{ p.dir }}（{{ p.name }}）"
          cd {{ (m2k_patch_tmp_dir ~ '/' ~ p.dir) | quote }}
          perl patch_installer.pl
          test "$(tail -n1 {{ m2k_patch_record_file | quote }} | cut -f1)" = "{{ p.name }}"
          {% endfor %}
      async: "{{ m2k_patch_timeout }}"
      poll: 15
      changed_when: true
      register: m2k_patch_install

# 安裝成功才會執行；任一個 patch 失敗時服務維持停止，由人確認後再處理
- name: 立即啟動服務
  ansible.builtin.meta: flush_handlers

- name: 顯示服務狀態
  when: m2k_patch_pending | length > 0 and not ansible_check_mode
  block:
    - name: 讀取服務狀態
      ansible.builtin.command:
        argv: [su, "{{ m2k_run_user }}", -c, "{{ m2k_ctrl_cmd }} -c status -s all"]
      changed_when: false
      failed_when: false
      register: m2k_patch_status

    - name: 顯示安裝結果
      ansible.builtin.debug:
        msg:
          - "已安裝：{{ m2k_patch_pending | map(attribute='dir') | join('、') }}"
          - "{{ m2k_patch_status.stdout_lines | default([]) }}"
