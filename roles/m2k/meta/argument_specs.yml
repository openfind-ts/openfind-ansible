---
argument_specs:
  main:
    short_description: Mail2000 安裝（同 install）
    options: {}
  install:
    short_description: 安裝 Mail2000
    options: {}
  patch:
    short_description: 更新 Mail2000 到指定版本
    options:
      m2k_version:
        type: str
        required: true
        description: 目標版本，例如 6.2

  cert:
    short_description: 更換 Mail2000 的 Web 憑證（呼叫 web_cert）
    options:
      m2k_cert_src:
        type: str
        required: true
        description: 憑證檔在 control node 上的路徑
      m2k_key_src:
        type: str
        required: true
        description: 私鑰檔在 control node 上的路徑（須以 ansible-vault 加密）

  check:
    short_description: Mail2000 健康檢查，只讀不改
    options: {}
