---
- name: 安裝 chrony
  ansible.builtin.dnf:
    name: chrony
    state: present

- name: 設定 chrony.conf
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart chronyd

- name: 啟用 chronyd
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true
