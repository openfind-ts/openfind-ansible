---
argument_specs:
  main:
    short_description: MailBase 安裝（同 install）
    options: {}
  install:
    short_description: 安裝 MailBase
    options: {}
  patch:
    short_description: 更新 MailBase 到指定版本
    options:
      mb_version:
        type: str
        required: true
        description: 目標版本，例如 6.2

  cert:
    short_description: 更換 MailBase 的 Web 憑證（呼叫 web_cert）
    options:
      mb_cert_src:
        type: str
        required: true
        description: 憑證檔在 control node 上的路徑
      mb_key_src:
        type: str
        required: true
        description: 私鑰檔在 control node 上的路徑（須以 ansible-vault 加密）

  check:
    short_description: MailBase 健康檢查，只讀不改
    options: {}
