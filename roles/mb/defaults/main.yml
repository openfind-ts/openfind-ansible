---
# MailBase 產品標準值：所有客戶都一樣的值放這裡，客戶差異放客戶 inventory 的 group_vars/mb.yml
mb_install_dir: /webmail
mb_conf_dir: "{{ mb_install_dir }}/httpd/conf"
mb_run_user: root
mb_restart_cmd: /webmail/httpd/bin/apachectl restart

# 換憑證（cert.yml → web_cert）
mb_ssl_conf: "TODO"  # TODO: 確認 MB 的 SSL 設定檔路徑
mb_ssl_include: "TODO"  # TODO: 確認是否需要在 httpd.conf 啟用 Include；不需要請改成空字串 ""
mb_cert_owner: "{{ mb_run_user }}"  # TODO: 確認憑證檔擁有者
mb_cert_src: ""  # 由客戶 group_vars/mb.yml 指定，例如 "{{ inventory_dir }}/files/mb.crt"
mb_key_src: ""   # 私鑰須以 ansible-vault encrypt 加密

# patch.yml 的目標版本，由客戶 group_vars/mb.yml 指定
mb_version: ""

# 這個產品內含的元件，CVE 掃描（playbooks/cve_check.yml）只掃有列出的元件
mb_components: []
# 各元件的實際位置；有寫就只搜這些目錄，沒寫才搜整個安裝目錄
mb_component_paths: {}
