---
# MailAudit 產品標準值：所有客戶都一樣的值放這裡，客戶差異放客戶 inventory 的 group_vars/mo.yml
mo_install_dir: /mailgates
mo_conf_dir: "{{ mo_install_dir }}/httpd/conf"
mo_run_user: root
mo_restart_cmd: /mailgates/httpd/bin/apachectl restart

# 換憑證（cert.yml → web_cert）
mo_ssl_conf: "{{ mo_conf_dir }}/extra/mg_ssl.conf"
mo_ssl_include: conf/extra/mg_ssl.conf  # httpd.conf 需要啟用的 Include
mo_cert_owner: "{{ mo_run_user }}"  # TODO: 確認憑證檔擁有者
mo_cert_src: ""  # 由客戶 group_vars/mo.yml 指定，例如 "{{ inventory_dir }}/files/mo.crt"
mo_key_src: ""   # 私鑰須以 ansible-vault encrypt 加密

# patch.yml 的目標版本，由客戶 group_vars/mo.yml 指定
mo_version: ""
