---
- name: 設定 sshd 演算法
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?\\s*{{ item.key }}\\s"
    line: "{{ item.key }} {{ item.value | join(',') }}"
    insertbefore: '^Match\s'
    validate: /usr/sbin/sshd -t -f %s
    backup: true
  loop: "{{ settings | dict2items | selectattr('value') | list }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    settings:
      Ciphers: "{{ weakscan_sshd_ciphers }}"
      MACs: "{{ weakscan_sshd_macs }}"
      KexAlgorithms: "{{ weakscan_sshd_kexalgorithms }}"
  notify: Restart sshd

