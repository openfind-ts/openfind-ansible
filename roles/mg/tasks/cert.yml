---
# 換完憑證並開啟 HTTPS：取消 httpd.conf 裡 Include conf/extra/mg_ssl.conf 的註解（同 MG 管理介面選「HTTPS」）
# 管理介面的「HTTPS 轉址」「HTTPS only」另外改 RewriteRule、Listen 80，這裡不動
- name: 更換 MailGates 憑證
  ansible.builtin.include_role:
    name: web_cert
  vars:
    web_cert_crt_src: "{{ mg_cert_src }}"
    web_cert_key_src: "{{ mg_key_src }}"
    web_cert_chain_src: "{{ mg_chain_src }}"
    web_cert_conf_dir: "{{ mg_conf_dir }}"
    web_cert_ssl_conf: "{{ mg_ssl_conf }}"
    web_cert_cert_dir: "{{ mg_cert_dir }}"
    web_cert_key_dir: "{{ mg_key_dir }}"
    web_cert_chain_dir: "{{ mg_chain_dir }}"
    web_cert_dir_mode: "0755"
    web_cert_include: "{{ mg_ssl_include }}"
    web_cert_owner: "{{ mg_cert_owner }}"
    web_cert_crt_mode: "0600"
    web_cert_versioned: true
    web_cert_keep_old_lines: false
    web_cert_name_prefix: server
    web_cert_restart_cmd: "{{ mg_restart_cmd }}"
    web_cert_configtest_cmd: "{{ mg_configtest_cmd }}"
    web_cert_verify_port: "{{ mg_cert_verify_port }}"
