---
# MailGates 產品標準值：所有客戶都一樣的值放這裡，客戶差異放客戶 inventory 的 group_vars/mg.yml
mg_install_dir: /mailgates
mg_conf_dir: "{{ mg_install_dir }}/httpd/conf"
mg_run_user: root
mg_restart_cmd: /mailgates/httpd/bin/apachectl restart

# 換憑證（cert.yml → web_cert）
mg_ssl_conf: "{{ mg_conf_dir }}/extra/mg_ssl.conf"
mg_ssl_include: conf/extra/mg_ssl.conf  # httpd.conf 需要啟用的 Include
mg_cert_owner: webmail  # 憑證檔擁有者（沿用課程單元二）
mg_cert_src: ""  # 由客戶 group_vars/mg.yml 指定，例如 "{{ inventory_dir }}/files/mg.crt"
mg_key_src: ""   # 私鑰須以 ansible-vault encrypt 加密

# patch.yml 的目標版本，由客戶 group_vars/mg.yml 指定
mg_version: ""
