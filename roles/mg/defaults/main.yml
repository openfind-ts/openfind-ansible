---
# MailGates 產品標準值：所有客戶都一樣的值放這裡，客戶差異放客戶 inventory 的 group_vars/mg.yml
mg_install_dir: /mailgates
mg_conf_dir: "{{ mg_install_dir }}/httpd/conf"
mg_run_user: webmail   # httpd 以 webmail 執行（httpd 有 cap_net_bind_service 才能聽 80/443）
# 官方控制腳本，須以 webmail 執行；-g 為 graceful。用 root 執行 apachectl 會讓 httpd 改以 root 執行
mg_ctl_cmd: "{{ mg_install_dir }}/mg/bin/mg_ctl.pl"
mg_restart_cmd: "su {{ mg_run_user }} -c '{{ mg_ctl_cmd }} -g restart httpd'"
mg_configtest_cmd: "su {{ mg_run_user }} -c '{{ mg_install_dir }}/httpd/bin/apachectl -t'"
# shutdown.yml：維護關機前停止服務。mg_ctl.pl 的 all 不含 httpd，httpd 由關機時的系統停掉
mg_stop_cmd: "su {{ mg_run_user }} -c '{{ mg_ctl_cmd }} stop all'"

# 換憑證（cert.yml → web_cert），照 MG 管理介面（mg_adm）的做法：
#   憑證 ssl.crt/server.crt.<後綴>、私鑰 ssl.key/server.key.<後綴>、中繼憑證 conf/server-ca.crt.<後綴>，權限 0600
#   直接改掉 mg_ssl.conf 原本的設定行；舊檔留著不刪
# 換完會開啟 HTTPS：取消 httpd.conf 裡這行 Include 的註解（新安裝預設是註解掉的），同管理介面選「HTTPS」
mg_ssl_conf: "{{ mg_conf_dir }}/extra/mg_ssl.conf"
mg_ssl_include: conf/extra/mg_ssl.conf
mg_cert_dir: "{{ mg_conf_dir }}/ssl.crt"
mg_key_dir: "{{ mg_conf_dir }}/ssl.key"
mg_chain_dir: "{{ mg_conf_dir }}"
mg_cert_owner: "{{ mg_run_user }}"
mg_cert_src: ""    # 由客戶 group_vars/mg.yml 指定，例如 "{{ inventory_dir }}/files/mg.crt"；只放伺服器憑證
mg_chain_src: ""   # 中繼憑證，例如 "{{ inventory_dir }}/files/mg-ca.crt"；空字串表示不動原本的 SSLCertificateChainFile
mg_key_src: ""     # 私鑰須以 ansible-vault encrypt 加密
mg_cert_verify_port: 443   # 換完確認這個 port 送出的是新憑證

# patch.yml 的目標版本，由客戶 group_vars/mg.yml 指定
mg_version: ""

# 這個產品內含的元件，CVE 掃描（playbooks/cve_check.yml）只掃有列出的元件
mg_components: [php]
# 各元件的實際位置；有寫就只搜這些目錄，沒寫才搜整個安裝目錄
mg_component_paths:
  php:
    - /mailgates/php/bin
