[defaults]
# 一律在 repo 根目錄執行，並用 -i 指定客戶，例如 -i ../customer-inventories/customer-a
roles_path = ./roles
forks = 10
callback_result_format = yaml
interpreter_python = auto_silent
retry_files_enabled = False

[inventory]
# 客戶資料夾的 files/ 放憑證等檔案，不是 inventory 來源
ignore_patterns = ^files$

[privilege_escalation]
become_method = sudo
