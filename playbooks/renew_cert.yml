---
# SSP 換憑證方式不同，尚未定義，所以不在這裡
- name: 更換憑證 M2K
  hosts: m2k
  become: true
  serial: 1
  max_fail_percentage: 0
  tasks:
    - name: 執行 M2K cert
      ansible.builtin.include_role:
        name: m2k
        tasks_from: cert

