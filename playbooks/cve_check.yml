---
# 依 CVE 定義檔掃描所有產品主機，只讀不改
# 用法：ansible-playbook -i ../customer-inventories/<客戶> playbooks/cve_check.yml -e cve=CVE-2026-109618
# 各產品內含哪些元件，寫在 roles/<產品>/defaults/main.yml 的 <產品>_components；沒有該元件的產品標成 not_applicable
- name: 掃描 M2K
  hosts: m2k
  become: true
  gather_facts: false
  tasks:
    # 只為了載入 m2k role 的標準值（m2k_install_dir、m2k_components），不執行任何 task
    - name: 載入 M2K 標準值
      ansible.builtin.import_role:
        name: m2k
        tasks_from: check
      when: false

    - name: 掃描 M2K 的 CVE
      ansible.builtin.include_role:
        name: weakscan
        tasks_from: cve_check
      vars:
        weakscan_cve_file: "{{ playbook_dir }}/../cves/{{ cve }}.yml"
        weakscan_cve_components: "{{ m2k_components }}"
        weakscan_cve_component_paths: "{{ m2k_component_paths }}"
        weakscan_cve_search_paths: ["{{ m2k_install_dir }}"]

